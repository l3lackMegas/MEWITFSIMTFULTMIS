name: Ship the regression

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Check release tag and repository
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run test:bun
      - run: npm run test:package
      - name: Publish with npm trusted publishing (OIDC)
        run: npm publish --access public --ignore-scripts
        # All release checks ran above. No long-lived NPM_TOKEN is needed.
